<text x="800.00" y="528.00" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Конструктивные изменения</text>
<text x="800.00" y="558.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">1. Внутренний радиус крюка уменьшен до 8 мм по запросу.</text>
<text x="800.00" y="586.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">2. Отверстие Ø5 сделано вертикальным и перенесено в вершину дуги.</text>
<text x="800.00" y="614.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">3. Толщина стенки и полки везде сохранена 4 мм.</text>
<text x="800.00" y="642.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">4. Усиление выполнено плавным касательным плечом в правом сопряжении.</text>
<text x="800.00" y="670.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">5. Хвост детали завершен скруглением 2x R10 без острых углов.</text>
<text x="800.00" y="698.00" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="start">6. Печать: на боковой грани, PETG/ASA, не менее 5 периметров.</text>
